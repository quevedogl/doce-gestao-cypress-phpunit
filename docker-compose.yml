services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    command: sh -c "test -f .env || cp .env.example .env; composer install; php artisan key:generate --force; php artisan migrate:fresh --seed; php artisan serve --host=0.0.0.0 --port=8000"
